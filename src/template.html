<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
</head>
<body>
    <dialog id="edit-project-dialog"></dialog>
    <dialog id="add-project-dialog"></dialog>
    <dialog id="add-todo-dialog"></dialog>
    <dialog id="edit-todo-dialog"></dialog>


    <div class="big-container">
        <div class="header"></div>
        <div class="sidebar">
            <div class="sidebar-top">
                <div class="project-names">
                    <div class="project-name-container">
                        <button class="show-projects">^</button>
                        <p class="active-project-title"></p>
                    </div>
                    <div class="project-list-container hidden"></div>
                </div>
                <div class="project-description">
                    <p class="active-description"></p>
                </div>
                <button class="edit-project-btn">Edit project</button>
                <button class="delete-project-btn">Delete project</button>
            </div>

            <div class="sidebar-bottom">
                <button class="add-project-btn">Add a new project</button>
            </div>
           
        </div>
        <div class="todo-content">
            <div class="left-content">
                <div class="greetings">
                    <p class="greeting"></p>
                </div>
                <div class="todo-grid-card">
                    <div class="todo-card-title">Todo List</div>
                    <div class="add-todo-container">
                        <button class="add-todo-btn">Add a todo</button>
                    </div>
                    <div class="todos-container">
                    </div>
                </div>

            </div>
            <div class="right-content">
                <div class="time">
                    <div class="clock"></div>
                    <div>Time</div>
                </div>
                <div class="calender-card">
                    <div class="calendar"></div>
                </div>
                <div class="percent-completed">
                    <div class="day"></div>
                    <div class="bar-container">
                         <div class="bar">
                            <div class="bar-fill"></div>
                        </div>
                    </div>
                    <div class="percent"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
